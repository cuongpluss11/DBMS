[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashsale-benchmark"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
flashsale = "flashsale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: uses an explicitly selected real project database"]
