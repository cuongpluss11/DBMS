name: flashsale-tidb
x-tikv: &tikv
  image: pingcap/tikv:v8.5.7@sha256:59e3938480776caf2aa86010b4bf4bcb88ccd401707f2f3b25f99997578190b9
  platform: linux/amd64
  cpus: 1
  mem_limit: 1536m
  depends_on: [pd]
services:
  pd:
    image: pingcap/pd:v8.5.7@sha256:d6f15a94617dbb9778b4a5e81d5a4ec1e795bf1818cf8821dca21960a2d61986
    platform: linux/amd64
    cpus: 0.25
    mem_limit: 512m
    command: ["--name=pd", "--data-dir=/data", "--client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://pd:2379", "--peer-urls=http://0.0.0.0:2380", "--advertise-peer-urls=http://pd:2380", "--initial-cluster=pd=http://pd:2380", "--config=/etc/pd.toml"]
    ports:
      - "127.0.0.1:${FLASHSALE_PD_PORT:-12379}:2379"
    volumes:
      - pd_data:/data
      - ./pd.toml:/etc/pd.toml:ro
  tikv1:
    <<: *tikv
    command: ["--addr=0.0.0.0:20160", "--advertise-addr=tikv1:20160", "--data-dir=/data", "--pd=pd:2379", "--config=/etc/tikv.toml"]
    volumes:
      - tikv1_data:/data
      - ./tikv.toml:/etc/tikv.toml:ro
  tikv2:
    <<: *tikv
    command: ["--addr=0.0.0.0:20160", "--advertise-addr=tikv2:20160", "--data-dir=/data", "--pd=pd:2379", "--config=/etc/tikv.toml"]
    volumes:
      - tikv2_data:/data
      - ./tikv.toml:/etc/tikv.toml:ro
  tikv3:
    <<: *tikv
    command: ["--addr=0.0.0.0:20160", "--advertise-addr=tikv3:20160", "--data-dir=/data", "--pd=pd:2379", "--config=/etc/tikv.toml"]
    volumes:
      - tikv3_data:/data
      - ./tikv.toml:/etc/tikv.toml:ro
  tidb:
    image: pingcap/tidb:v8.5.7@sha256:eda497853e94c77c6849fb582e26181bd298d3fc7f32589997bd6359d3aa8bdf
    platform: linux/amd64
    cpus: 0.75
    mem_limit: 1g
    command: ["--store=tikv", "--path=pd:2379", "--host=0.0.0.0", "--advertise-address=tidb"]
    depends_on: [tikv1, tikv2, tikv3]
    ports:
      - "127.0.0.1:${FLASHSALE_TIDB_PORT:-14000}:4000"
volumes:
  pd_data:
  tikv1_data:
  tikv2_data:
  tikv3_data:
