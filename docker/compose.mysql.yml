name: flashsale-mysql
services:
  mysql:
    image: mysql:8.4.8@sha256:4fc4bca5a26c5aa2246a92779d238bc2d34f0373e65dc083d7b635b02780dd3d
    platform: linux/amd64
    # Độ bền đặt tường minh (đề 2.1): flush log mỗi commit + sync binlog mỗi commit.
    # Buffer pool mặc định 128 MiB = "MySQL-mặc-định"; đặt FLASHSALE_MYSQL_BUFFER_POOL_BYTES
    # (ví dụ 3221225472 = 3 GiB, bằng 3 TiKV x 1 GiB block cache) cho "MySQL-chỉnh".
    command:
      - mysqld
      - --max-connections=${FLASHSALE_MYSQL_MAX_CONNECTIONS:-151}
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      - --innodb-buffer-pool-size=${FLASHSALE_MYSQL_BUFFER_POOL_BYTES:-134217728}
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${FLASHSALE_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    cpus: 8
    mem_limit: 16g
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "-h", "127.0.0.1", "-uroot", "-Nse", "SELECT 1"]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  mysql_data:
